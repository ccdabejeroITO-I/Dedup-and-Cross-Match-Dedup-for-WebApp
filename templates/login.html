<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_title }} · v{{ app_version }}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}">
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="card auth-card" aria-labelledby="login-heading">
      <a class="brand" href="/">CM <span>CrossMatch Browser <small>v{{ app_version }}</small></span></a>
      <h1 id="login-heading">Welcome back</h1>
      <p class="muted">Sign in to your approved CrossMatch account.</p>
      <div id="message" role="alert" class="notice hidden"></div>
      <form id="auth-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" required minlength="3" maxlength="80" autocomplete="username">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" required minlength="1" maxlength="256" autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>
      <div class="auth-alt" aria-label="New account options">
        <p class="muted">New to CrossMatch?</p>
        <a class="button secondary" href="/register">Create account</a>
        <p class="auth-approval-note">Administrator approval is required before you can sign in.</p>
      </div>
    </section>
  </main>
  <script src="/static/js/auth.js?v={{ app_version }}" defer></script>
</body>
</html>
