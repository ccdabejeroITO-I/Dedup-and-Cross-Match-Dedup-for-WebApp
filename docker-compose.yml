name: crossmatch_browser_v631
services:
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      CROSSMATCH_CACHE_ROOT: /app/cache
      CROSSMATCH_AUTH_DB_ROOT: /app/database
      CROSSMATCH_COOKIE_SECURE: ${CROSSMATCH_COOKIE_SECURE:-0}
      CROSSMATCH_SETUP_KEY: ${CROSSMATCH_SETUP_KEY:-}
      TMPDIR: /app/cache
      CACHE_EXPIRATION_HOURS: ${CACHE_EXPIRATION_HOURS:-12}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-25}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      CROSSMATCH_CPU_WORKERS: ${CROSSMATCH_CPU_WORKERS:-0}
      CROSSMATCH_MEMORY_PERCENT: ${CROSSMATCH_MEMORY_PERCENT:-80}
      CROSSMATCH_FAST_EXCEL: ${CROSSMATCH_FAST_EXCEL:-1}
      # Avoid each RapidFuzz worker also spawning BLAS/OpenMP threads.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MALLOC_ARENA_MAX: '2'
    volumes:
      # I/O-heavy temporary input, indexes and results use Docker's Linux-side volume.
      - crossmatch_fast_temp:/app/cache
      # Keep existing admin accounts when upgrading from the previous release.
      - ./database:/app/database
    ports:
      - "127.0.0.1:${CROSSMATCH_HTTP_PORT:-18090}:8000"
    shm_size: '512m'
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/selftest',timeout=5)); raise SystemExit(0 if d['ok'] else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    stop_grace_period: 120s
  proxy:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./certificates:/etc/nginx/certs
    ports:
      - "${CROSSMATCH_HTTPS_BIND_IP:-127.0.0.1}:${CROSSMATCH_HTTPS_PORT:-18444}:443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=/dev/null", "https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
volumes:
  crossmatch_fast_temp:
